[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tvsm-smad"
version = "0.1.0"
description = "Speech and music activity detection using a CRNN model trained on the TVSM dataset"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
authors = [
    {name = "Yun-Ning Hung"},
    {name = "Chih-Wei Wu"},
    {name = "Iroro Orife"},
    {name = "Aaron Hipple"},
    {name = "William Wolcott"},
    {name = "Alexander Lerch"},
]
keywords = ["audio", "speech", "music", "detection", "activity", "mir", "smad"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
 
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "librosa>=0.10.0",
    "numpy>=1.24",
    "torch>=2.0",
    "torchaudio>=2.0",
    "torchvision>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff",
]

[project.scripts]
tvsm-detect = "tvsm_smad.cli:main"

[project.urls]
Repository = "https://github.com/biboamy/TVSM-dataset"
Paper = "https://asmp-eurasipjournals.springeropen.com/articles/10.1186/s13636-022-00253-8"
Dataset = "https://zenodo.org/record/7025971"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tvsm_smad = ["models/**/*.pt"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
